<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Job Application </title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="page">

<!-- Step Tracker -->
<div class="progress">
<div class="step active" id="tracker-1">
<div class="circle">1</div>
<span class="step-label">Register</span>
</div>
<div class="line" id="trackerLine"></div>
<div class="step" id="tracker-2">
<div class="circle">2</div>
<span class="step-label">Apply</span>
</div>
</div>

<div class="card">

<!-- Registration Form -->
<section id="registerForm" class="panel">
<h1>Registration Form</h1>
<p class="subtext">Fill the details below to continue.</p>

<form id="registration" novalidate>

<div class="field">
<label for="name">Full Name</label>
<input type="text" id="name" placeholder="e.g. Aryah Abraham" autocomplete="name">
<small class="error" id="nameError"></small>
</div>

<div class="field">
<label for="email">Email</label>
<input type="email" id="email" placeholder="e.g. aryah@gmail.com" autocomplete="email">
<small class="error" id="emailError"></small>
 
</div>

<div class="field">
<label for="phone">Phone Number</label>
<input type="text" id="phone" placeholder="10-digit mobile number" autocomplete="tel">
<small class="error" id="phoneError"></small>
</div>

<div class="field">
<label for="password">Password</label>
<div class="password-field">
<input type="password" id="password" placeholder="Create a password" autocomplete="new-
 
password">
 

<i class="fa-solid fa-eye" onclick="togglePassword('password', this)"></i>
</div>
<div class="password-strength"><div class="strength-bar" id="strengthFill"></div></div>
<small class="hint" id="strengthLabel">Min 8 characters, with upper, lower, number &amp;
 
symbol</small>
<small class="error" id="passwordError"></small>
</div>

<div class="field">
<label for="confirmPassword">Confirm Password</label>
<div class="password-field">
<input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-
 
password">
 

<i class="fa-solid fa-eye" onclick="togglePassword('confirmPassword', this)"></i>
</div>
<small class="error" id="confirmError"></small>
 
</div>

<button type="submit" class="submit-btn">Register <i class="fa-solid fa-arrow-right"></i></button>
</form>
</section>

<!-- Job Application Form -->
<section id="jobForm" class="panel hidden">
<h1>Job Application</h1>

<form id="application" novalidate>

<div class="field-row">
<div class="field">
<label for="position">Position</label>
<select id="position">
<option value="">Select position</option>
<option>Software Engineer</option>
<option>Web Developer</option>
<option>Data Analyst</option>
<option>UI/UX Designer</option>
<option>QA Engineer</option>
</select>
<small class="error" id="positionError"></small>
</div>

<div class="field">
<label for="level">Job Level</label>
<select id="level">
<option value="">Select level</option>
<option>Intern</option>
<option>Junior</option>
<option>Mid-Level</option>
<option>Senior</option>
 
</select>
<small class="error" id="levelError"></small>
</div>
</div>

<div class="field">
<label for="experience">Experience (years)</label>
<input type="number" id="experience" placeholder="0 - 30" min="0" max="30">
<small class="error" id="experienceError"></small>
</div>

<div class="field">
<label for="skills">Skills</label>
<input type="text" id="skills" placeholder="e.g. JavaScript, SQL, Communication">
<small class="error" id="skillsError"></small>
</div>

<div class="field">
<label for="project">Describe Your Projects</label>
<div class="charcount"><span id="charCount">0</span> / 50 characters minimum</div>
<small class="error" id="projectError"></small>
</div>

<div class="field">
<label for="resume">Resume</label>
<label class="upload-box" id="fileDrop" for="resume">
<i class="fa-solid fa-file-arrow-up"></i>
<span id="fileLabel">Click to upload PDF or DOCX</span>
</label>
<input type="file" id="resume" accept=".pdf,.docx" hidden>
<small class="error" id="resumeError"></small>
</div>

<div class="form-actions">
<button type="button" class="back-btn" id="backBtn"><i class="fa-solid fa-arrow-left"></i> Back</button>
<button type="submit" class="submit-btn">Submit Application</button>
</div>
</form>
</section>

<!-- SUCCESS -->
<section id="successScreen" class="panel hidden success">
<div class="success-icon"><i class="fa-solid fa-circle-check"></i></div>
<h1>Application Submitted Successfully!</h1>
</section>

</div>
</div>

<script src="script.js"></script>
</body>
</html>
