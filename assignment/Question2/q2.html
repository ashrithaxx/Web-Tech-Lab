<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Registration</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#222}
  .wrap{max-width:800px;margin:auto}
  h1{text-align:center;color:#2c3e50}
  .card{background:#fff;padding:16px 20px;border-radius:8px;box-shadow:0 1px 4px #0002;margin-bottom:20px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}
  th{background:#2c3e50;color:#fff}
  input{width:100%;padding:8px;margin:4px 0 12px;border:1px solid #bbb;border-radius:4px;box-sizing:border-box}
  button{background:#2c3e50;color:#fff;border:0;padding:8px 16px;border-radius:4px;cursor:pointer}
  .msg{margin-top:10px;padding:8px;border-radius:4px;display:none}
  .ok{background:#d4edda;color:#155724;display:block}
  .err{background:#f8d7da;color:#721c24;display:block}
</style>
</head>
<body>
<div class="wrap">
  <h1>Student Registration</h1>
  <div class="card">
    <h2>Register Student (POST)</h2>
    <form id="form">
      <label>Name</label><input id="name" required>
      <label>Email</label><input id="email" type="email" required>
      <label>Phone</label><input id="phone" required>
      <button type="submit">Register</button>
    </form>
    <div id="formMsg" class="msg"></div>
  </div>
</div>

<script>
const API = "https://jsonplaceholder.typicode.com/users";

function show(el, text, ok) {
  el.textContent = text;
  el.className = "msg " + (ok ? "ok" : "err");
}

function statusText(s) {
  const m = {400:"Bad Request",401:"Unauthorized",403:"Forbidden",404:"Not Found",500:"Internal Server Error"};
  return `Error ${s}: ${m[s] || "Request failed"}`;
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("formMsg");
  const body = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim()
  };
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    });
    if (res.status === 201) {
      const d = await res.json();
      show(msg, `Student registered successfully (HTTP 201), ID: ${d.id}`, true);
      e.target.reset();
    } else {
      show(msg, statusText(res.status), false);
    }
  } catch (err) {
    show(msg, "Network error: unable to reach server", false);
  }
});
</script>
</body>
</html>
