<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome Home</title>
    <style>
      * {
        font-family: Arial, sans-serif;
        color: #000;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f2f4f8;
      }
      nav {
        background: #fff;
        padding: 16px 40px;
        display: flex;
        gap: 28px;
        border-bottom: 2px solid #000;
        font-weight: bold;
      }
      nav a {
        text-decoration: none;
        padding-bottom: 4px;
      }
      nav a.active {
        border-bottom: 3px solid #000;
      }
      .card {
        max-width: 620px;
        margin: 70px auto;
        background: #fff;
        padding: 40px;
        border: 2px solid #000;
        border-radius: 12px;
        box-shadow: 8px 8px 0 #000;
      }
      h1 {
        margin-top: 0;
        font-size: 36px;
      }
      p {
        line-height: 1.6;
        font-size: 18px;
      }
      .btn {
        display: inline-block;
        margin-top: 10px;
        padding: 10px 22px;
        border: 2px solid #000;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
      }
      .btn:hover {
        background: #000;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="active">Home</a
      ><a href="about.html" class="">About</a>
    </nav>
    <div class="card">
      <h1>Welcome Home</h1>
      <p>
        This website is served by a Node.js server built with the http, fs and
        path modules.
      </p>
      <a class="btn" href="about.html">Go to About</a>
    </div>
  </body>
</html>
